# Approved speculative-decoding drafters (§2.9.4), per benchmark.
#
# §2.9.4 makes this "a curated, published list, not a single fixed drafter",
# published in the reference repository and versioned per submission round. The
# agentic benchmarks' list is published in mlcommons/endpoints
# examples/10_Agentic_Inference/README.md, "Approved Checkpoints and
# Speculative-Decoding Heads"; the entries below transcribe it. The DeepSeek-R1 and
# gpt-oss-120b entries are carried over from legacy submissions. A benchmark absent
# here still has no approved drafter, so speculative decoding stays disallowed for it.
#
# Override with `--approved-drafters FILE` or $MLPERF_ENDPOINTS_APPROVED_DRAFTERS
# when the task force publishes a newer list, without waiting for a checker release.
#
# Shape, per §2.9.4's two identification forms:
#
#   drafters:
#     - benchmark: llama3_1-8b
#       approved_cohort: 2026-10-C1      # the cohort the updated list was published in
#       model_id: acme/llama3-eagle      # weight-identified
#       weight_checksum: sha256:...
#     - benchmark: deepseek-r1
#       approved_cohort: 2026-10-C1
#       target_checksum: sha256:...      # configuration-identified
#       configuration:
#         exit_layer: 24
#
# How the reference entries are transcribed:
#
# - Weight-identified. MTP and DSpark heads carry their own weights (§2.9.4's
#   configuration form is for drafters with none). A head native to an approved
#   checkpoint is identified by that checkpoint.
# - weight_checksum is the Hugging Face revision the README pins, as
#   `git-sha1:<revision>`. A revision is the git commit of the model repository; its
#   tree pins every weight file's SHA-256 through the LFS pointers, so it identifies
#   the published weights exactly.
# - These initial entries are recorded against 2026-09-C1. §2.9.4 records an approval
#   against the cohort in which the updated list is published. The README published the
#   Qwen and Kimi heads on 2026-09-10 (endpoints#494), after the 2026-09-02 C0
#   publication, and the DeepSeek-V4.1-Flash head on 2026-09-30 (endpoints#519), after the
#   2026-09-16 C1 one; 2026-09-C1 is the cohort window by which both were published.
#   Counted instead from the next publication date, the DeepSeek-V4.1-Flash entry would be
#   2026-10-C0. The two-cohort approval lead time makes these entries eligible starting
#   with target cohort 2026-10-C1.
#   Future entries record their own approval cohorts alongside these entries.
# - The DeepSeek-R1 and gpt-oss-120b entries are carried over from legacy submissions
#   as task-force seed entries (§2.9.4: "the benchmark task force seeds the list with
#   ≥ 1 approved head/drafter per benchmark model"). They are recorded with the other
#   initial approvals in 2026-09-C1, so they are eligible starting with target cohort
#   2026-10-C1.

drafters:
  # Kimi K3: separately published DSpark heads (endpoints#494).
  - benchmark: kimi-k3
    approved_cohort: 2026-09-C1
    model_id: RadixArk/Kimi-K3-DSpark
    weight_checksum: git-sha1:3c5bac301d9cf392706189d82ed947feca6c2f0f
  - benchmark: kimi-k3
    approved_cohort: 2026-09-C1
    model_id: Inferact/Kimi-K3-DSpark
    weight_checksum: git-sha1:cf6b8244620e7ea4b0651d214f28e89eac75bed6

  # DeepSeek-V4.1-Flash: the native DSpark head in the approved checkpoint (endpoints#519).
  - benchmark: deepseek-v4_1-flash
    approved_cohort: 2026-09-C1
    model_id: deepseek-ai/DeepSeek-V4.1-Flash
    weight_checksum: git-sha1:dba1be0a40aa45a94ad051997016db3960a90277

  # Qwen3.6-35B-A3B: the native MTP heads in each approved checkpoint (endpoints#494).
  - benchmark: qwen3_6-35b-a3b
    approved_cohort: 2026-09-C1
    model_id: Qwen/Qwen3.6-35B-A3B
    weight_checksum: git-sha1:995ad96eacd98c81ed38be0c5b274b04031597b0
  - benchmark: qwen3_6-35b-a3b
    approved_cohort: 2026-09-C1
    model_id: Qwen/Qwen3.6-35B-A3B-FP8
    weight_checksum: git-sha1:95a723d08a9490559dae23d0cff1d9466213d989
  - benchmark: qwen3_6-35b-a3b
    approved_cohort: 2026-09-C1
    model_id: nvidia/Qwen3.6-35B-A3B-NVFP4
    weight_checksum: git-sha1:1355db6a052410cfd62085d94b58866fd0f2c3c5

  # DeepSeek-R1: the native MTP head (layer 61) in each approved checkpoint, carried
  # over from legacy submissions. The NVFP4 checkpoint is post-training quantized on the
  # MLPerf Inference deepseek-r1 calibration set and keeps the MTP layer.
  - benchmark: deepseek-r1
    approved_cohort: 2026-09-C1
    model_id: deepseek-ai/DeepSeek-R1
    weight_checksum: git-sha1:56d4cbbb4d29f4355bab4b9a39ccb717a14ad5ad
  - benchmark: deepseek-r1
    approved_cohort: 2026-09-C1
    model_id: centml/DeepSeek-R1-NVFP4-v2-mlpinf
    weight_checksum: git-sha1:93947a0d7bd04f73ff98636f6b18ff5839e7aaf9

  # gpt-oss-120b: a separately published EAGLE3 head, carried over from legacy
  # submissions. This is the repository nvidia/gpt-oss-120b-Eagle3 redirects to; the
  # head is unquantized (hf_quant_config.json quant_algo: null).
  - benchmark: gpt-oss-120b
    approved_cohort: 2026-09-C1
    model_id: nvidia/gpt-oss-120b-Eagle3-long-context
    weight_checksum: git-sha1:633caf45f31288cbb70ee237f7c939db707ecc94
