# MLPerf Endpoints published seed sets (§4.6 Seed Rotation).
#
# Mirrored from `mlcommons/endpoints_policies` PR #117 (`feat/add-1.0-seeds`),
# file `seedset.yaml`. PR #117 is OPEN at the time of writing — if its values
# change before merge, re-mirror them here.
#
# A submission binds exactly one set, names it in every point's `seed_set`, and
# seeds the client's RNGs from it. §4.6 additionally requires the bound set to
# have been published for the submission's `target_cohort` or one of the three
# preceding cohorts; the upstream file carries no cohort keys yet, so `cohorts`
# is left empty and the adoption test reports SKIP until it does.
#
# Override this file with `--seed-sets FILE` or $MLPERF_ENDPOINTS_SEED_SETS so a
# newly published set can be used without waiting for a checker release.

seed_sets:
  - id: A
    scheduler_rng_seed: 10487924139932647040
    sample_index_rng_seed: 586478644936801402
    model_seed: 9315206023656308754
    cohorts: []
