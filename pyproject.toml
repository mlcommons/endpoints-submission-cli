[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoints-submission-cli"
version = "0.1.0"
description = "CLI tool for managing MLPerf endpoint submissions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MLCommons", email = "arav@mlcommons.org" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
endpoints-submission-cli = "endpoints_submission_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "furo>=2024.1",
]

[tool.setuptools]
packages = [
    "endpoints_submission_cli",
    "endpoints_submission_cli.commands",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=submission_checker --cov-report=term-missing -v"
markers = [
    "unit: fast, isolated unit tests (no network, no subprocesses)",
    "integration: tests that require a running API at http://localhost:8080",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (likely bugs / bad practices)
    "C4",  # flake8-comprehensions (unnecessary comprehension patterns)
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator — sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["submission_checker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "TCH",    # test files don't need TYPE_CHECKING optimisation
    "E501",   # long patch() target strings are unavoidable in test files
    "SIM117", # deeply-nested with-patch blocks are intentional for clarity
]
