name: "Review hints"

# Reusable workflow: automated hints for the §9.2 manual review of an MLPerf Endpoints
# submission, posted as one PR comment that is updated in place on every push.
#
# Called from the review repository (endpoints_submissions) on the `submission/<id>`
# PRs the lifecycle manager opens; see
# docs/endpoints-cli/reference/submission-reviewer.md for the caller workflow.
#
# Advisory only: this job never fails because of what it finds, and its names are
# deliberately not "Check submission" / "Run submission checker", which the lifecycle
# manager matches to gate compliance (lifecycle_manager.lifecycle._COMPLIANCE_*).
#
# Nothing from the PR is executed. The reviewer is installed from PyPI into a venv
# outside the checkout and only parses the submission's files; the checkout keeps no
# credentials. The comment is written with the job's GITHUB_TOKEN, limited to
# pull-requests: write.
on:
  workflow_call:
    inputs:
      cli-version:
        description: >-
          endpoints-submission-cli version to install from PyPI (e.g. 1.7.0.0). Pin it;
          blank installs the latest release.
        type: string
        default: ""
      path:
        description: Where to look for submissions in the checkout.
        type: string
        default: "."
      logs-artifact:
        description: >-
          Name of an artifact, uploaded by an earlier job of the calling workflow, that
          mirrors results/ (<system>/<model>/r<N>/events.jsonl). Enables the checks that
          read per-request logs. Blank skips them.
        type: string
        default: ""
      thresholds-yaml:
        description: YAML overriding any of the packaged heuristic tolerances.
        type: string
        default: ""

permissions: {}

jobs:
  review:
    name: "Review hints"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: review-hints-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The whole PR history: the original submission is compared with the head.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reviewer
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        run: |
          python -m venv "$RUNNER_TEMP/reviewer"
          "$RUNNER_TEMP/reviewer/bin/pip" install --quiet \
            "endpoints-submission-cli${CLI_VERSION:+==$CLI_VERSION}"

      - name: Fetch the per-request logs
        if: inputs.logs-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.logs-artifact }}
          path: ${{ runner.temp }}/logs

      - name: Review the submission
        id: review
        env:
          SUBMISSIONS: ${{ github.workspace }}/${{ inputs.path }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          LOGS: ${{ inputs.logs-artifact != '' && format('{0}/logs', runner.temp) || '' }}
          THRESHOLDS_YAML: ${{ inputs.thresholds-yaml }}
        working-directory: ${{ runner.temp }}
        run: |
          args=("$SUBMISSIONS" --pr-base "$PR_BASE" -o "$RUNNER_TEMP/review.md")
          if [ -n "$LOGS" ]; then args+=(--logs-dir "$LOGS"); fi
          if [ -n "$THRESHOLDS_YAML" ]; then
            printf '%s\n' "$THRESHOLDS_YAML" > "$RUNNER_TEMP/thresholds.yaml"
            args+=(--thresholds "$RUNNER_TEMP/thresholds.yaml")
          fi
          if "$RUNNER_TEMP/reviewer/bin/endpoints-submission-reviewer" "${args[@]}"; then
            echo "comment=$RUNNER_TEMP/review.md" >> "$GITHUB_OUTPUT"
          else
            # No submission yet (e.g. the placeholder commit), or a broken thresholds
            # input: say so in the log and leave the PR alone.
            echo "::warning::The submission reviewer could not run; no comment posted."
          fi

      - name: Post or update the PR comment
        if: steps.review.outputs.comment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT: ${{ steps.review.outputs.comment }}
        run: |
          # The reviewer's comment starts with this marker (submission_reviewer.render).
          # Only a comment this workflow wrote is updated, never one that quotes it.
          marker='<!-- submission-reviewer -->'
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\")
                       | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$COMMENT" > /dev/null
            echo "Updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$COMMENT" > /dev/null
            echo "Posted a new comment"
          fi
