concurrency: 4096
dataset: mlperf-perf-dataset-v1
runtime_settings:
  load_pattern: concurrency
  min_duration_ms: 1200000
  runtime:
    dataloader_random_seed: 42
    scheduler_random_seed: 42
  stream_all_chunks: true
warmup:
  concurrency: 4096
  data_source: mlperf-perf-dataset-v1 validation split
  duration_s: 60.0
  initialization_steps:
  - model loaded
  - kv-cache warmed
  requests_completed: 40960
  requests_issued: 40960
